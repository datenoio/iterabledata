name: Bug Report
description: Report incorrect behavior, crashes, or documentation errors
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Include a minimal repro when possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. open_iterable('file.csv')
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: IterableData version
      placeholder: pip show iterabledata
    validations:
      required: false

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: python --version
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
    validations:
      required: false
