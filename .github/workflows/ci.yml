name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Ruff lint (blocking)
      run: ruff check iterable tests

    - name: Ruff format check (blocking)
      run: ruff format --check iterable tests

    - name: Mypy core modules (blocking)
      run: mypy --follow-imports=silent iterable/types.py iterable/exceptions.py iterable/async_base.py

    - name: Mypy full package (advisory)
      run: mypy iterable || true

    - name: Pydocstyle (advisory)
      run: pydocstyle iterable || true

    - name: Dead code check with Vulture (advisory)
      run: vulture iterable --min-confidence 80 || true

    - name: Code complexity with Radon (advisory)
      run: radon cc iterable --min B || true

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      run: |
        pytest --verbose --cov=iterable --cov-report=xml --cov-report=term

    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        flags: unittests

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Bandit high-severity scan (blocking)
      run: bandit -r iterable --severity-level high

    - name: Bandit full report (advisory)
      run: bandit -r iterable -ll || true

    - name: Dependency vulnerability scan with pip-audit (advisory)
      run: |
        pip freeze > requirements-frozen.txt
        pip-audit --requirement requirements-frozen.txt || true
        rm requirements-frozen.txt
