name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    # Full history is required by the "Mypy changed files" step below: it diffs
    # against the base branch via a three-dot (merge-base) git diff.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Ruff lint (blocking)
      run: ruff check iterable tests

    - name: Ruff format check (blocking)
      run: ruff format --check iterable tests

    # Blocking zero-error gate. Only files verified clean under this exact
    # command may be added (OpenSpec strengthen-repository-quality-gates 3.3);
    # the same modules carry disallow_untyped_defs in pyproject [tool.mypy].
    - name: Mypy core modules (blocking)
      run: |
        mypy --follow-imports=skip \
          iterable/__init__.py \
          iterable/base.py \
          iterable/codec_base.py \
          iterable/guidance.py \
          iterable/exceptions.py \
          iterable/types.py \
          iterable/dataframe_adapters.py \
          iterable/async_base.py \
          iterable/helpers/utils.py \
          iterable/helpers/detect.py \
          iterable/helpers/open_iterable.py \
          iterable/helpers/content_detection.py \
          iterable/helpers/format_registry.py \
          iterable/helpers/__init__.py \
          iterable/helpers/format_descriptions.py \
          iterable/helpers/progress.py \
          iterable/helpers/read_ahead.py

    - name: Fixture coverage report (advisory)
      run: python dev/scripts/find_missing_fixtures.py || true

    - name: Mypy full package (advisory)
      run: mypy iterable || true

    # Ratchets the full-package mypy error count against dev/mypy_baseline.txt.
    # Advisory (`|| true`) until the baseline proves stable in CI — mypy counts
    # are environment-sensitive (optional deps) and CI is the reference env.
    # Becomes blocking by dropping `|| true`.
    - name: Mypy error-count ratchet (advisory)
      run: python dev/scripts/mypy_ratchet.py || true

    # New-code strictness: mypy must pass on every iterable/*.py file changed
    # vs the base branch (three-dot diff; needs the fetch-depth: 0 checkout
    # above). Advisory (continue-on-error) until it proves stable in CI;
    # becomes blocking by dropping continue-on-error. See CONTRIBUTING.md.
    - name: Mypy changed files vs base branch (advisory)
      continue-on-error: true
      run: python dev/scripts/mypy_changed_files.py

    # Docstring-style gate: all findings are cleared to zero, and pydocstyle
    # exits nonzero when findings exist, so the direct invocation is blocking.
    - name: Pydocstyle gate (blocking)
      run: pydocstyle iterable

    # Dead-code gate: all findings are cleared to zero; vulture exits nonzero
    # on findings, so the direct invocation is blocking. Protocol-required
    # parameter names (``__exit__``/``seek``) are whitelisted in
    # dev/vulture_whitelist.py.
    - name: Vulture gate (blocking)
      run: vulture iterable dev/vulture_whitelist.py --min-confidence 80

    - name: Code complexity with Radon (advisory)
      run: radon cc iterable --min B || true

    # Complexity gate: no D-or-worse graded functions. Blocking now that all
    # D-or-worse functions have been refactored. `radon cc` always exits 0, so
    # the gate is enforced by grepping its output for D/E/F rank lines.
    - name: Complexity gate, no D-or-worse functions (blocking)
      run: |
        OUTPUT=$(radon cc iterable --min D)
        echo "$OUTPUT"
        COUNT=$(echo "$OUTPUT" | grep -cE " - [DEF]$" || true)
        echo "COMPLEXITY GATE: $COUNT D-or-worse function(s) remain"
        ! echo "$OUTPUT" | grep -qE " - [DEF]$"

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json

    - name: Install dependencies
      working-directory: ./docs
      run: npm ci

    - name: Build documentation site (blocking)
      working-directory: ./docs
      run: npm run build

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      run: |
        pytest --verbose --cov=iterable --cov-report=xml --cov-report=term

    # The fail_under=50 floor (pyproject [tool.coverage.report]) is enforced by
    # pytest-cov during the test step above; this step makes the result explicit.
    # The base-env picture (lower, advisory) is printed by the test-base-env job.
    - name: Coverage floor check (full dev env)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        echo "COVERAGE FLOOR CHECK (full dev env): fail_under=50 enforced by pytest-cov in the test step above."
        coverage report --fail-under=0 | tail -n 1

    - name: Assert committed fixtures were not modified
      run: git diff --exit-code -- tests/fixtures

    - name: Per-package coverage report (advisory)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: python dev/scripts/coverage_by_package.py || true

    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        flags: unittests

    # Publishes the core (full-suite) coverage report as a CI artifact alongside
    # the per-family artifacts from the optional-family-smoke job, so an
    # aggregate step could combine them.
    - name: Upload core coverage artifact
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-core
        path: coverage.xml

  # Base environment: dev tooling only, no optional format extras.
  # Guards against collection errors from top-level optional imports in tests
  # (missing extras must skip, never error).
  test-base-env:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dev tooling only (no format extras)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Also prints the base-env coverage picture. Advisory: --cov-fail-under=0
    # overrides the configured floor because optional extras are absent here, so
    # their modules import-skip and count as uncovered (floor enforced on the
    # full dev-env matrix legs instead).
    - name: Run suite without extras (zero collection errors required)
      run: pytest --verbose --cov=iterable --cov-report=term:skip-covered --cov-fail-under=0

    - name: Coverage floor check (base env, advisory)
      run: |
        echo "COVERAGE FLOOR CHECK (base env): dev tooling only, no optional format extras."
        echo "fail_under=50 is NOT enforced here (--cov-fail-under=0); compare with the matrix-leg floor check."
        coverage report --fail-under=0 | tail -n 1

    - name: Assert committed fixtures were not modified
      run: git diff --exit-code -- tests/fixtures

  minimal-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install .
      - name: Import and CSV/JSONL smoke
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from iterable.helpers.detect import open_iterable

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              csv_path = root / "rows.csv"
              csv_path.write_text("id,name\n1,one\n", encoding="utf-8")
              jsonl_path = root / "rows.jsonl"
              jsonl_path.write_text(json.dumps({"id": 1}) + "\n", encoding="utf-8")
              assert list(open_iterable(str(csv_path))) == [{"id": "1", "name": "one"}]
              assert list(open_iterable(str(jsonl_path))) == [{"id": 1}]
          PY

  optional-family-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: columnar
            extras: "parquet"
            tests: "tests/test_parquet.py tests/test_arrow.py"
            cov: "*/datatypes/parquet.py,*/datatypes/arrow.py"
          - family: geospatial
            extras: "geospatial,parquet"
            tests: "tests/test_geoparquet.py"
            cov: "*/datatypes/geoparquet.py"
          - family: bio
            extras: "alignment,bio"
            tests: "tests/test_genomic_intervals.py"
            cov: "*/datatypes/genomic_intervals.py,*/datatypes/genomic_vcf.py"
          - family: codecs
            extras: "compression"
            tests: "tests/test_codec_profiles.py"
            cov: "*/codecs/*"
          - family: scientific
            extras: "hdf5,netcdf,npy"
            tests: "tests/test_numpy.py"
            cov: "*/datatypes/numpy.py"
          - family: database
            extras: "db"
            tests: "tests/test_db_engines.py -k 'not integration'"
            cov: "*/db/*,*/engines/*"
          - family: lakehouse
            extras: "lakehouse"
            tests: "tests/test_delta.py tests/test_iceberg.py"
            cov: "*/datatypes/delta.py,*/datatypes/iceberg.py"
    name: optional-${{ matrix.family }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install compression system libraries
        if: matrix.family == 'codecs'
        timeout-minutes: 4
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Azure Ubuntu mirrors occasionally stall apt-get for tens of minutes.
          for attempt in 1 2 3; do
            echo "apt-get attempt ${attempt}"
            if sudo timeout 60 apt-get -o Acquire::Retries=2 update \
              && sudo timeout 60 apt-get -o Acquire::Retries=2 install -y --no-install-recommends liblzo2-dev libsnappy-dev; then
              exit 0
            fi
            echo "apt-get attempt ${attempt} failed or timed out; retrying"
            sleep 3
          done
          echo "apt-get failed after retries" >&2
          exit 1
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,${{ matrix.extras }}]"
      # Coverage runs serially within the job on purpose: pytest-xdist (-n) must
      # NOT be combined with coverage here — tests/conftest.py chdirs to a
      # disposable runtime root in pytest_configure, which would scatter
      # per-worker coverage data. --cov-fail-under=0 keeps the global floor=50
      # enforced only on the full-dev-env matrix legs; family subsets are
      # reported below, not floored (see CONTRIBUTING.md "Coverage floors").
      - name: Run family tests with coverage (missing extras must skip, failures must be visible)
        run: pytest ${{ matrix.tests }} --cov=iterable --cov-report=xml:coverage-${{ matrix.family }}.xml --cov-fail-under=0
      - name: Family coverage report (term-missing, advisory)
        run: coverage report --include="${{ matrix.cov }}" --show-missing --fail-under=0
      - name: Upload family coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.family }}
          path: |
            coverage-${{ matrix.family }}.xml
            .coverage
          include-hidden-files: true
          if-no-files-found: warn
      - name: Assert committed fixtures were not modified
        run: git diff --exit-code -- tests/fixtures

  # Single-leg performance regression gate: compares representative workloads
  # against committed normalized baselines (tests/performance_baselines.json).
  # Runs on one OS/Python only; timings are normalized by an in-session
  # calibration workload so the committed baselines stay portable.
  performance-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pyarrow

    - name: Run performance regression gate (blocking)
      run: pytest tests/test_performance_regression.py -m performance --no-cov --verbose

  # Dedicated benchmark job: @pytest.mark.benchmark tests are excluded from the
  # default matrix (see addopts) and only run here, advisory-only, so timing
  # noise never gates ordinary changes.
  benchmarks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run benchmarks (advisory)
      run: pytest -m benchmark --no-cov --verbose || true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Bandit high-severity scan (blocking)
      run: bandit -r iterable --severity-level high

    - name: Bandit full report (advisory)
      run: bandit -r iterable -ll || true

    - name: Dependency vulnerability scan with pip-audit (blocking)
      run: |
        pip freeze > requirements-frozen.txt
        pip-audit --requirement requirements-frozen.txt
        rm requirements-frozen.txt
