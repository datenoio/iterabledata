name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.5, v2.0.0, etc.
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for tags
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel setuptools check-wheel-contents
    
    - name: Extract version from tag
      id: tag_version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          # Fallback for workflow_dispatch
          VERSION=$(python -c "import ast, pathlib; tree = ast.parse(pathlib.Path('iterable/__init__.py').read_text()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(getattr(target, 'id', None) == '__version__' for target in node.targets)))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        fi
        echo "Extracted version: $VERSION"
        echo "Tag: $(cat $GITHUB_OUTPUT | grep tag | cut -d= -f2)"
    
    - name: Verify version matches tag
      run: |
        PYTHON_VERSION=$(python -c "import ast, pathlib; tree = ast.parse(pathlib.Path('iterable/__init__.py').read_text()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(getattr(target, 'id', None) == '__version__' for target in node.targets)))")
        EXPECTED_VERSION="${{ steps.tag_version.outputs.version }}"
        if [ "$PYTHON_VERSION" != "$EXPECTED_VERSION" ]; then
          echo "ERROR: Version mismatch!"
          echo "Python package version: $PYTHON_VERSION"
          echo "Expected version from tag: $EXPECTED_VERSION"
          exit 1
        fi
        echo "Version verification passed: $PYTHON_VERSION"
    
    - name: Run release smoke tests
      run: |
        pip install -e ".[dev]"
        python -m pytest --no-cov \
          tests/test_import_optional_dependencies.py \
          tests/test_schema.py \
          -q
    
    - name: Build source distribution and wheel
      run: |
        python -m build
    
    - name: Check distribution files
      run: |
        ls -lh dist/
        python -m twine check dist/*
        check-wheel-contents dist/*.whl
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag_version.outputs.tag }}
        name: Release ${{ steps.tag_version.outputs.tag }}
        body: |
          ## Release ${{ steps.tag_version.outputs.tag }}
          
          ### Changes
          See [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ steps.tag_version.outputs.tag }}/CHANGELOG.md) for details.
          
          ### Installation
          
          ```bash
          pip install iterabledata==${{ steps.tag_version.outputs.version }}
          ```
          
          ### Distribution Files
          - Source distribution (`.tar.gz`)
          - Wheel (`.whl`)
          
          Built on: ${{ github.run_started_at }}
        draft: false
        prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # PyPI publishing happens in python-publish.yml, triggered when the
    # GitHub Release created above is published (single publish path,
    # using PyPI Trusted Publishing).
