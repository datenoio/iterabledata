name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        
    - name: Build package
      run: python -m build
      
    - name: Publish package
      # Uses PyPI Trusted Publishing (OIDC via id-token permission above).
      # Configure the publisher for this repo/workflow at:
      # https://pypi.org/manage/project/iterabledata/settings/publishing/
      uses: pypa/gh-action-pypi-publish@release/v1
